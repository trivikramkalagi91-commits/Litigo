<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Litigo — Rules</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="logo">
        <img src="icons/icon48.png" alt="Litigo" class="logo-mark-img" style="width: 28px; height: 28px; object-fit: contain;">
        <span class="logo-text">LITIGO</span>
      </div>
      <label class="master-toggle">
        <input type="checkbox" id="masterEnabled" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="subtitle">AI Rule Enforcer</div>

    <div class="section-label">Your Rules</div>
    <div id="rulesList" class="rules-list"></div>

    <div class="add-rule">
      <input type="text" id="newRuleInput" placeholder="Add a new rule...">
      <button id="addRuleBtn">+</button>
    </div>

    <div class="quick-add">
      <div class="section-label">Quick Add</div>
      <div class="quick-buttons">
        <button class="quick-btn" data-rule='{"text":"Never make future predictions","type":"forbidden","keywords":["will","going to","predict","forecast","expected to"]}'>No predictions</button>
        <button class="quick-btn" data-rule='{"text":"Keep responses concise","type":"length"}'>Be concise</button>
        <button class="quick-btn" data-rule='{"text":"Always use bullet points","type":"format"}'>Bullet points</button>
        <button class="quick-btn" data-rule='{"text":"Use simple language","type":"style"}'>Simple language</button>
      </div>
    </div>

    <div class="truth-section" style="margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08);">
      <div class="section-label" style="margin-bottom: 6px; font-weight: 700; font-size: 11px; color: #334155;">📄 TRUTH LAYER GROUNDING</div>
      <input type="file" id="truthDocInput" accept=".txt,.md,.json,.pdf" style="display:none;">
      <button id="uploadDocBtn" style="width:100%; padding: 7px 10px; background: #eff6ff; color: #1d4ed8; border: 1px dashed #93c5fd; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <span>📄</span> <span>Upload Reference Doc (.txt / .md)</span>
      </button>
      <div id="truthDocStatus" style="font-size: 10.5px; color: #059669; font-weight: 600; margin-top: 5px; text-align: center; display: none;"></div>
    </div>

    <div class="footer">
      <div class="stats">
        <span id="statChecks">0 checks</span>
        <span id="statCaught">0 caught</span>
      </div>
      <div class="badge">Powered by Moss</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
